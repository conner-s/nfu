# nfu config — copy to ~/.config/nfu/config.toml and adjust.
#
# The only thing nfu truly needs is where your flake lives. Point it there once
# and `nfu totality` (or any input name) updates that input from anywhere.

# The flake to operate on: the directory containing flake.nix / flake.lock.
# A leading ~ is expanded. Overridable per-run with --flake / $NFU_FLAKE.
flakeRoot = "~/Projects/nixos-config"

# When true, a successful update also `git commit`s the resulting flake.lock
# (only that file, never a push) with a generated message like
# "flake.lock: update totality (6bdb38a → a1b2c3d)".
# Override per-run with --commit / --no-commit. Default: false.
commit = false

# TUI color theme: default | gruvbox-dark | gruvbox-light | muted.
# The default uses ANSI palette codes, inheriting your terminal's scheme; the
# named themes are truecolor (downsampled on terminals without it). An unknown
# name fails at load with the valid set.
# theme = "gruvbox-dark"

# Where the per-file project definitions live (see `nfu project`). Defaults to
# a "projects" directory beside this config; point it at a git-tracked path to
# version-control your projects.
# projectsDir = "~/.config/nfu/projects"

# --- nfu project ------------------------------------------------------------
#
# A "project" bundles an update → `nh os switch` → deploy pipeline behind one
# command: `nfu project run <name>` (alias it to `npr`). Hosts are the deploy-rs
# nodes to activate after the local switch; deployArgs are extra `deploy` flags
# (Fabricator needs --magic-rollback false — its confirmation canary never lands).
#
# Hosts are declared here; projects can be declared here too, but usually live
# as one file each under projectsDir (write them with `nfu project add`, or
# declare them via the home-manager module — see the README).

[hosts.Fabricator]
hostname   = "192.168.4.10"
deployArgs = ["--magic-rollback", "false"]

[hosts.Servitor]
hostname = "192.168.4.100"          # no deployArgs → a bare `deploy .#Servitor`

# An inline project (equivalently: projects/totality.toml with these keys, minus
# the [projects.totality] wrapper):
[projects.totality]
inputs      = ["totality"]
hosts       = ["Fabricator"]        # optional; omit for a local-only project
# localSwitch = false               # remote-only: skip `nh os switch`

# A BUNDLE: a project defined by the projects it includes rather than by inputs
# of its own. `nfu project run workstation -y` updates the union of totality's
# and npk's inputs in ONE lock write, rebuilds the local host ONCE, and deploys
# each host once — the shape you want when several repos moved at the same time
# and you just want the box current. Editing totality.toml changes what this
# covers; there is no second copy of the input list to fall behind.
#
# `nfu @workstation` runs the same expansion at the lock level only: it moves
# the inputs and stops, no switch and no deploy.
[projects.workstation]
includes = ["totality", "npk"]
# inputs = ["nixpkgs"]              # optional: extras this bundle adds itself
